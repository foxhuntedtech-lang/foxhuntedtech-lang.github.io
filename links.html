<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .hub-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .hub-card {
      width: min(460px, 100%);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
    }
    .hub-body {
      padding: 1.6rem 1.4rem;
    }
    .hub-logo {
      width: 100%;
      max-width: 310px;
      margin: 0 auto 0.9rem;
      display: block;
    }
    .hub-sub {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      margin: 0 0 1.5rem;
    }
    .hub-links {
      display: grid;
      gap: 0.9rem;
    }
    .hub-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.1rem;
      border: 2.5px solid var(--ink);
      text-decoration: none;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--ink);
      background: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .hub-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .hub-btn-wa { background: var(--yellow); }
    .hub-btn-ig { background: var(--magenta); color: #fff; }
    .hub-btn-web { background: var(--ink); color: var(--paper); }
    .hub-foot {
      margin-top: 1.4rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="hub-wrap">
    <section class="hub-card">
      <div class="hazard-strip"></div>
      <div class="hub-body">
        <img src="assets/FOXHUNTED_Logo_Color.svg" alt="FOXHUNTED" class="hub-logo" />
        <p class="hub-sub">UNIT_09 // REPARACIÓN Y MANTENIMIENTO DE PC &amp; LAPTOPS</p>

        <div class="hub-links">
          <a href="index.html" class="hub-btn hub-btn-web">
            <span>🌐 PÁGINA WEB Y COTIZADOR</span>
            <span>→</span>
          </a>

          <a href="https://wa.me/524448656388?text=Hola%20FOXHUNTED,%20vengo%20de%20tu%20c%C3%B3digo%20QR%20y%20necesito%20cotizar%20un%20servicio." target="_blank" rel="noopener" class="hub-btn hub-btn-wa">
            <span>💬 WHATSAPP (444-865-6388)</span>
            <span>→</span>
          </a>

          <a href="https://instagram.com/foxhunted.tech" target="_blank" rel="noopener noreferrer" class="hub-btn hub-btn-ig">
            <span>📸 INSTAGRAM (@foxhunted.tech)</span>
            <span>→</span>
          </a>

          <a href="mailto:foxhunted.tech@gmail.com" class="hub-btn">
            <span>✉️ CORREO (foxhunted.tech@gmail.com)</span>
            <span>→</span>
          </a>
        </div>

        <p class="hub-foot">ESCANEADO DESDE FLYER // FOXHUNTED</p>
      </div>
      <div class="hazard-strip"></div>
    </section>
  </main>
</body>
</html>
